/* ═══════════════════════════════════════════════════════════════
   Design System — 考试学习平台
   清新活力 · iOS 26 Liquid Glass
   Translucent materials, frosted glass, spring motion, generous radii.
   ═══════════════════════════════════════════════════════════════ */

:root {
  /* ── Brand Primary · Emerald Green ── */
  --primary: #10B981;
  --primary-strong: #059669;
  --primary-soft: #ECFDF5;
  --primary-border: #A7F3D0;
  --primary-glow: rgba(16, 185, 129, 0.2);

  /* ── Surfaces · iOS 26 Liquid Glass ── */
  --bg: #F2F4F8;
  --surface: #FFFFFF;
  --surface-muted: #F1F5F9;
  --surface-elevated: #FFFFFF;

  /* ── Glass Materials (Liquid Glass核心) ── */
  --glass-nav: rgba(255, 255, 255, 0.72);
  --glass-nav-blur: 24px;
  --glass-card: rgba(255, 255, 255, 0.65);
  --glass-card-blur: 20px;
  --glass-header: rgba(255, 255, 255, 0.68);
  --glass-header-blur: 20px;
  --glass-overlay: rgba(255, 255, 255, 0.55);
  --glass-overlay-blur: 40px;
  --glass-highlight: rgba(255, 255, 255, 0.5);
  --glass-border: rgba(255, 255, 255, 0.6);

  /* ── Text ── */
  --text-primary: #0F172A;
  --text-secondary: #475569;
  --text-muted: #94A3B8;
  --text-placeholder: #CBD5E1;

  /* ── Borders ── */
  --border: #E2E8F0;
  --border-soft: #F1F5F9;
  --border-strong: #CBD5E1;

  /* ── State Colors (semantic only, not identity) ── */
  --state-success: #10B981;
  --state-success-soft: #ECFDF5;
  --state-warning: #F59E0B;
  --state-warning-soft: #FFFBEB;
  --state-warning-border: #FDE68A;
  --state-error: #EF4444;
  --state-error-soft: #FEF2F2;
  --state-error-border: #FECACA;
  --state-info: #3B82F6;
  --state-info-soft: #EFF6FF;

  /* ── Radii · iOS 26 generous scale ── */
  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-lg: 20px;
  --radius-xl: 24px;
  --radius-full: 9999px;

  /* ── Shadows · Liquid Glass depth ── */
  --shadow-xs: 0 1px 3px rgba(15, 23, 42, 0.04);
  --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
  --shadow-card: 0 4px 16px rgba(15, 23, 42, 0.06);
  --shadow-elevated: 0 8px 32px rgba(15, 23, 42, 0.10);
  --shadow-modal: 0 24px 64px rgba(15, 23, 42, 0.18);
  --shadow-primary: 0 8px 24px rgba(16, 185, 129, 0.22);
  --glass-inner-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.5);

  /* ── Typography ── */
  --font-sans: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-display: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Consolas, monospace;

  /* ── Font sizes ── */
  --text-xs: 0.6875rem;    /* 11px */
  --text-sm: 0.8125rem;   /* 13px */
  --text-md: 0.875rem;    /* 14px */
  --text-base: 0.9375rem;  /* 15px */
  --text-lg: 1.125rem;    /* 18px */
  --text-xl: 1.375rem;    /* 22px */
  --text-2xl: 1.75rem;    /* 28px */

  /* ── Spacing ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;

  /* ── Transitions · iOS 26 Spring Motion ── */
  --ease-out: 0.28s cubic-bezier(0.32, 0.72, 0, 1);
  --ease-spring: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-spring-gentle: 0.35s cubic-bezier(0.25, 1, 0.5, 1);
  --ease-bounce: 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

/* ── Dark Mode · iOS 26 ── */
.dark {
  --bg: #000000;
  --surface: #1C1C1E;
  --surface-muted: #2C2C2E;
  --surface-elevated: #1C1C1E;

  --glass-nav: rgba(28, 28, 30, 0.72);
  --glass-card: rgba(44, 44, 46, 0.65);
  --glass-header: rgba(28, 28, 30, 0.68);
  --glass-overlay: rgba(28, 28, 30, 0.55);
  --glass-highlight: rgba(255, 255, 255, 0.08);
  --glass-border: rgba(255, 255, 255, 0.12);

  --text-primary: #F1F5F9;
  --text-secondary: #CBD5E1;
  --text-muted: #64748B;
  --text-placeholder: #475569;

  --border: #3A3A3C;
  --border-soft: #2C2C2E;
  --border-strong: #475569;

  --primary-soft: #064E3B;
  --primary-border: #065F46;

  --state-success-soft: #064E3B;
  --state-warning-soft: #451A03;
  --state-warning-border: #78350F;
  --state-error-soft: #450A0A;
  --state-error-border: #7F1D1D;
  --state-info-soft: #172554;

  --shadow-xs: 0 1px 3px rgba(0, 0, 0, 0.3);
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.3);
  --glass-inner-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.06);
}

/* ═══════════════════════════════════════════════════════════════
   Typography Classes
   ═══════════════════════════════════════════════════════════════ */

    <style>
  /* ═══════════════════════════════════════════════════════════════
     PART 1 · Shell CSS · iOS 26 Liquid Glass Floating Capsule Nav
     ═══════════════════════════════════════════════════════════════ */

  /* ── 1.1 基础重置 ── */
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0; padding: 0;
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── 1.2 应用容器 ── */
  .shell-container {
    position: relative;
    display: flex;
    flex-direction: column;
    max-width: 420px;
    min-height: 100vh;
    margin: 0 auto;
    background: var(--bg);
    box-shadow: 0 0 40px rgba(15, 23, 42, 0.10);
    overflow: hidden;
  }

  /* ── 1.2b 装饰性背景光斑 · iOS 26 深度感 ──
     两个模糊渐变光斑固定在容器顶部，透过玻璃卡片产生色彩折射。 */
  .shell-container::before {
    content: '';
    position: absolute;
    top: -60px;
    right: -40px;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  .shell-container::after {
    content: '';
    position: absolute;
    top: 120px;
    left: -60px;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* 内容区在光斑之上 */
  .shell-content { position: relative; z-index: 1; }
  .bottom-nav { z-index: 50; }

  /* ── 1.3 内容区 · 底部预留悬浮导航空间 ── */
  .shell-content {
    flex: 1;
    padding-bottom: 96px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
  }

  /* ═══════════════════════════════════════════════════════════════
     1.4 底部悬浮胶囊导航 · iOS 26 Liquid Glass Floating Capsule
     ─────────────────────────────────────────────────────────────────
     核心特征：
     · 悬浮于内容之上，不贴底边（bottom: 20px）
     · 左右留边距（width: calc(100% - 32px)）
     · 胶囊外形（border-radius: 9999px）
     · 液态玻璃材质（半透明 + 模糊 + 饱和度增强 + 内高光）
     · 选中项有玻璃透镜高亮（glass lens blob）
     ═══════════════════════════════════════════════════════════════ */
  .bottom-nav {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 388px;
    height: 64px;
    background: var(--glass-nav);
    backdrop-filter: blur(var(--glass-nav-blur)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--glass-nav-blur)) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 9999px;
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    padding: 6px;
    gap: 2px;
    z-index: 50;
    box-shadow:
      0 8px 32px rgba(15, 23, 42, 0.12),
      0 2px 8px rgba(15, 23, 42, 0.06),
      var(--glass-inner-highlight);
  }

  /* ── 1.5 单个标签 ──
     胶囊内等分；选中项有玻璃透镜背景。 */
  .nav-item {
    flex: 1;
    height: 52px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    background: transparent;
    border: none;
    border-radius: 9999px;
    color: var(--text-muted);
    font-family: var(--font-sans);
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
    position: relative;
    transition: color var(--ease-out), background var(--ease-spring), box-shadow var(--ease-spring);
  }

  .nav-item:active {
    transform: scale(0.92);
  }

  .nav-item svg {
    width: 22px;
    height: 22px;
    stroke-width: 2;
    transition: transform var(--ease-spring);
  }

  /* ── 1.6 选中态 · Glass Lens 透镜高亮 ──
     iOS 26 标志性效果：选中项背后出现玻璃透镜圆角矩形 */
  .nav-item.active,
  .nav-item[data-active="true"] {
    color: var(--primary);
    background: rgba(16, 185, 129, 0.12);
    box-shadow:
      inset 0 0 0 1px rgba(16, 185, 129, 0.15),
      var(--glass-inner-highlight);
  }

  .nav-item.active svg,
  .nav-item[data-active="true"] svg {
    transform: scale(1.1);
  }

  /* ── 1.7 强调标签 · 导入 ──
     不再凸出导航栏；改为胶囊内的实心圆形图标按钮。 */
  .nav-item--emphasis {
    flex: 0 0 auto;
    width: 52px;
  }

  .nav-emphasis-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--primary);
    color: #FFFFFF;
    box-shadow:
      0 4px 12px rgba(16, 185, 129, 0.30),
      var(--glass-inner-highlight);
    transition: box-shadow var(--ease-out), transform var(--ease-spring);
  }

  .nav-item--emphasis:active .nav-emphasis-badge {
    transform: scale(0.90);
  }

  .nav-emphasis-badge svg {
    width: 20px;
    height: 20px;
    stroke-width: 2.5;
  }

  /* 强调标签选中态 · 玻璃透镜环 */
  .nav-item--emphasis.active,
  .nav-item--emphasis[data-active="true"] {
    background: rgba(16, 185, 129, 0.12);
    box-shadow:
      inset 0 0 0 1px rgba(16, 185, 129, 0.15),
      var(--glass-inner-highlight);
  }

  .nav-item--emphasis.active .nav-emphasis-badge,
  .nav-item--emphasis[data-active="true"] .nav-emphasis-badge {
    box-shadow:
      0 4px 12px rgba(16, 185, 129, 0.30),
      0 0 0 3px var(--primary-soft),
      var(--glass-inner-highlight);
  }

  /* ── 1.8 标签文字 ── */
  .nav-label {
    font-family: var(--font-sans);
    font-size: 10px;
    font-weight: 600;
    line-height: 1;
  }

  /* ═══════════════════════════════════════════════════════════════
     Dark Mode 深色模式
     ═══════════════════════════════════════════════════════════════ */
  .dark .bottom-nav {
    background: var(--glass-nav);
    backdrop-filter: blur(var(--glass-nav-blur)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--glass-nav-blur)) saturate(180%);
    border-color: var(--glass-border);
  }

  .dark .nav-item.active,
  .dark .nav-item[data-active="true"] {
    background: rgba(16, 185, 129, 0.18);
    box-shadow: inset 0 0 0 1px rgba(16, 185, 129, 0.20), var(--glass-inner-highlight);
  }

  .dark .nav-emphasis-badge {
    box-shadow: 0 4px 14px rgba(16, 185, 129, 0.50), var(--glass-inner-highlight);
  }

  .dark .nav-item--emphasis.active .nav-emphasis-badge,
  .dark .nav-item--emphasis[data-active="true"] .nav-emphasis-badge {
    box-shadow: 0 4px 14px rgba(16, 185, 129, 0.50), 0 0 0 3px var(--primary-soft), var(--glass-inner-highlight);
  }
    </style>

    <!-- Page-specific CSS · iOS 26 Liquid Glass -->
    <style>
      /* ── Upload Zone · dashed border drop area ── */
      .ai-upload-zone {
        width: 100%;
        height: 140px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: var(--surface-muted);
        border: 2px dashed var(--border-strong);
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: background var(--ease-out), transform var(--ease-spring), border-color var(--ease-out);
      }
      .ai-upload-zone:hover { background: var(--primary-soft); border-color: var(--primary); }
      .ai-upload-zone:active { transform: scale(0.99); }
      .ai-upload-zone:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: -4px;
      }
      .ai-upload-icon {
        width: 44px; height: 44px;
        color: var(--primary);
        transition: transform var(--ease-spring);
      }
      .ai-upload-zone:hover .ai-upload-icon { transform: translateY(-2px); }
      .ai-upload-title {
        font-size: var(--text-base); font-weight: 700;
        color: var(--text-primary);
      }
      .ai-upload-sub {
        font-size: var(--text-xs);
        color: var(--text-muted);
      }
      .ai-formats {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 14px;
        border-top: 1px solid var(--glass-border);
        background: rgba(241, 245, 249, 0.4);
        overflow-x: auto;
        flex-wrap: nowrap;
        -webkit-overflow-scrolling: touch;
      }
      .ai-formats::-webkit-scrollbar { display: none; }
      .ai-format-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 10px;
        border-radius: var(--radius-full);
        background: var(--surface);
        font-size: 11px;
        font-weight: 600;
        color: var(--text-secondary);
        white-space: nowrap;
        flex-shrink: 0;
        transition: transform var(--ease-spring);
      }
      .ai-format-badge:active { transform: scale(0.94); }

      /* ── JSON Paste Section Card · glass material ── */
      div:has(> .ai-json-toggle) {
        background: var(--glass-card) !important;
        backdrop-filter: blur(var(--glass-card-blur)) saturate(180%);
        -webkit-backdrop-filter: blur(var(--glass-card-blur)) saturate(180%);
        border-radius: var(--radius-lg) !important;
        border-color: var(--glass-border) !important;
        box-shadow: var(--glass-inner-highlight);
      }
      .ai-json-toggle {
        transition: background var(--ease-out);
      }
      .ai-json-toggle:hover {
        background: var(--surface-muted);
      }
      .ai-json-toggle:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: -2px;
      }

      /* ── JSON Code Block · subtle glass bg, keep monospace ── */
      .ai-json-toggle + div > pre {
        background: var(--glass-overlay) !important;
        backdrop-filter: blur(var(--glass-card-blur)) saturate(180%);
        -webkit-backdrop-filter: blur(var(--glass-card-blur)) saturate(180%);
      }

      /* ── Preview Cards · glass material + spring hover lift ── */
      .ai-preview-card {
        background: var(--glass-card) !important;
        backdrop-filter: blur(var(--glass-card-blur)) saturate(180%);
        -webkit-backdrop-filter: blur(var(--glass-card-blur)) saturate(180%);
        border-radius: var(--radius-lg) !important;
        border-color: var(--glass-border) !important;
        box-shadow: var(--glass-inner-highlight);
        transition: border-color var(--ease-out), transform var(--ease-spring) !important;
      }
      .ai-preview-card:hover {
        border-color: var(--primary-border) !important;
        transform: translateY(-2px);
      }

      /* ── Action Bar (sticky) · glass nav material ── */
      .ai-action-bar {
        background: var(--glass-nav) !important;
        backdrop-filter: blur(var(--glass-nav-blur)) saturate(180%);
        -webkit-backdrop-filter: blur(var(--glass-nav-blur)) saturate(180%);
        border-color: var(--glass-border) !important;
        border-radius: var(--radius-full) !important;
      }

      /* ── CTA Button · spring transition + active scale ── */
      .ai-cta-exam {
        transition: background var(--ease-out), transform var(--ease-spring), box-shadow var(--ease-out) !important;
      }
      .ai-cta-exam:hover {
        background: var(--primary-strong) !important;
        box-shadow: 0 10px 24px rgba(16, 185, 129, 0.25) !important;
      }
      .ai-cta-exam:active {
        transform: scale(0.95);
      }
      .ai-cta-exam:focus-visible {
        outline: 2px solid var(--primary-strong);
        outline-offset: 2px;
      }

      .nav-item:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: -2px;
        border-radius: var(--radius-sm);
      }

      @media (hover: none) {
        .ai-upload-zone:hover { background: var(--surface-muted); transform: none; }
        .ai-upload-zone:hover .ai-upload-icon { transform: none; }
        .ai-json-toggle:hover { background: transparent; }
      }

      @media (prefers-reduced-motion: reduce) {
        .ai-upload-zone,
        .ai-upload-zone .ai-upload-icon,
        .ai-json-toggle,
        .ai-format-badge,
        .nav-item,
        .nav-emphasis-badge {
          transition: none !important;
          transform: none !important;
        }
      }
    </style>

    <script>lucide.createIcons();</script>
</body>
</html>
