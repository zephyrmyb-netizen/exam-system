    <style id="theme-vars">
/* ═══════════════════════════════════════════════════════════════
   Design System — 考试学习平台
   清新活力 · iOS 26 Liquid Glass
   Translucent materials, frosted glass, spring motion, generous radii.
   ═══════════════════════════════════════════════════════════════ */

:root {
  /* ── Brand Primary · Emerald Green ── */
  --primary: #10B981;
  --primary-strong: #059669;
  --primary-soft: #ECFDF5;
  --primary-border: #A7F3D0;
  --primary-glow: rgba(16, 185, 129, 0.2);

  /* ── Surfaces · iOS 26 Liquid Glass ── */
  --bg: #F2F4F8;
  --surface: #FFFFFF;
  --surface-muted: #F1F5F9;
  --surface-elevated: #FFFFFF;

  /* ── Glass Materials (Liquid Glass核心) ── */
  --glass-nav: rgba(255, 255, 255, 0.72);
  --glass-nav-blur: 24px;
  --glass-card: rgba(255, 255, 255, 0.65);
  --glass-card-blur: 20px;
  --glass-header: rgba(255, 255, 255, 0.68);
  --glass-header-blur: 20px;
  --glass-overlay: rgba(255, 255, 255, 0.55);
  --glass-overlay-blur: 40px;
  --glass-highlight: rgba(255, 255, 255, 0.5);
  --glass-border: rgba(255, 255, 255, 0.6);

  /* ── Text ── */
  --text-primary: #0F172A;
  --text-secondary: #475569;
  --text-muted: #94A3B8;
  --text-placeholder: #CBD5E1;

  /* ── Borders ── */
  --border: #E2E8F0;
  --border-soft: #F1F5F9;
  --border-strong: #CBD5E1;

  /* ── State Colors (semantic only, not identity) ── */
  --state-success: #10B981;
  --state-success-soft: #ECFDF5;
  --state-warning: #F59E0B;
  --state-warning-soft: #FFFBEB;
  --state-warning-border: #FDE68A;
  --state-error: #EF4444;
  --state-error-soft: #FEF2F2;
  --state-error-border: #FECACA;
  --state-info: #3B82F6;
  --state-info-soft: #EFF6FF;

  /* ── Radii · iOS 26 generous scale ── */
  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-lg: 20px;
  --radius-xl: 24px;
  --radius-full: 9999px;

  /* ── Shadows · Liquid Glass depth ── */
  --shadow-xs: 0 1px 3px rgba(15, 23, 42, 0.04);
  --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
  --shadow-card: 0 4px 16px rgba(15, 23, 42, 0.06);
  --shadow-elevated: 0 8px 32px rgba(15, 23, 42, 0.10);
  --shadow-modal: 0 24px 64px rgba(15, 23, 42, 0.18);
  --shadow-primary: 0 8px 24px rgba(16, 185, 129, 0.22);
  --glass-inner-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.5);

  /* ── Typography ── */
  --font-sans: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-display: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Consolas, monospace;

  /* ── Font sizes ── */
  --text-xs: 0.6875rem;    /* 11px */
  --text-sm: 0.8125rem;   /* 13px */
  --text-md: 0.875rem;    /* 14px */
  --text-base: 0.9375rem;  /* 15px */
  --text-lg: 1.125rem;    /* 18px */
  --text-xl: 1.375rem;    /* 22px */
  --text-2xl: 1.75rem;    /* 28px */

  /* ── Spacing ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;

  /* ── Transitions · iOS 26 Spring Motion ── */
  --ease-out: 0.28s cubic-bezier(0.32, 0.72, 0, 1);
  --ease-spring: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-spring-gentle: 0.35s cubic-bezier(0.25, 1, 0.5, 1);
  --ease-bounce: 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

/* ── Dark Mode · iOS 26 ── */
.dark {
  --bg: #000000;
  --surface: #1C1C1E;
  --surface-muted: #2C2C2E;
  --surface-elevated: #1C1C1E;

  --glass-nav: rgba(28, 28, 30, 0.72);
  --glass-card: rgba(44, 44, 46, 0.65);
  --glass-header: rgba(28, 28, 30, 0.68);
  --glass-overlay: rgba(28, 28, 30, 0.55);
  --glass-highlight: rgba(255, 255, 255, 0.08);
  --glass-border: rgba(255, 255, 255, 0.12);

  --text-primary: #F1F5F9;
  --text-secondary: #CBD5E1;
  --text-muted: #64748B;
  --text-placeholder: #475569;

  --border: #3A3A3C;
  --border-soft: #2C2C2E;
  --border-strong: #475569;

  --primary-soft: #064E3B;
  --primary-border: #065F46;

  --state-success-soft: #064E3B;
  --state-warning-soft: #451A03;
  --state-warning-border: #78350F;
  --state-error-soft: #450A0A;
  --state-error-border: #7F1D1D;
  --state-info-soft: #172554;

  --shadow-xs: 0 1px 3px rgba(0, 0, 0, 0.3);
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.3);
  --glass-inner-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.06);
}

/* ═══════════════════════════════════════════════════════════════
   Typography Classes
   ═══════════════════════════════════════════════════════════════ */

.ep-display {
  font-family: var(--font-display);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.2;
  color: var(--text-primary);
}

.ep-h1 {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.25;
  color: var(--text-primary);
}

.ep-h2 {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 800;
  letter-spacing: -0.01em;
  line-height: 1.3;
  color: var(--text-primary);
}

.ep-h3 {
  font-family: var(--font-sans);
  font-size: var(--text-lg);
  font-weight: 700;
  line-height: 1.35;
  color: var(--text-primary);
}

.ep-body {
  font-family: var(--font-sans);
  font-size: var(--text-base);
  font-weight: 400;
  line-height: 1.5;
  color: var(--text-secondary);
}

.ep-body-sm {
  font-family: var(--font-sans);
  font-size: var(--text-sm);
  font-weight: 400;
  line-height: 1.5;
  color: var(--text-secondary);
}

.ep-caption {
  font-family: var(--font-sans);
  font-size: var(--text-xs);
  font-weight: 600;
  line-height: 1.4;
  color: var(--text-muted);
}

.ep-label {
  font-family: var(--font-sans);
  font-size: var(--text-xs);
  font-weight: 700;
  line-height: 1.3;
  letter-spacing: 0.02em;
  color: var(--text-muted);
  text-transform: uppercase;
}

<body class="min-h-screen font-sans antialiased">
    <main>
        <style>
            /* ═══════════════════════════════════════════════════════════════
               Shell CSS · iOS 26 Liquid Glass
               取自 partials/project-shell.html (PART 1)
               沉浸式页面：保留 .shell-container / .shell-content，省略 .bottom-nav
               ═══════════════════════════════════════════════════════════════ */
            *,
            *::before,
            *::after { box-sizing: border-box; }

            body {
                margin: 0;
                padding: 0;
                font-family: var(--font-sans);
                background: var(--bg);
                color: var(--text-primary);
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            /* ── 应用容器 · iOS 26 深度感 ── */
            .shell-container {
                position: relative;
                display: flex;
                flex-direction: column;
                max-width: 420px;
                min-height: 100vh;
                margin: 0 auto;
                background: var(--bg);
                box-shadow: 0 0 40px rgba(15, 23, 42, 0.10);
                overflow: hidden;
            }

            /* ── 装饰性背景光斑 · iOS 26 深度感 ──
               两个模糊渐变光斑固定在容器顶部，透过玻璃卡片产生色彩折射。 */
            .shell-container::before {
                content: '';
                position: absolute;
                top: -60px;
                right: -40px;
                width: 200px;
                height: 200px;
                border-radius: 50%;
                background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
                pointer-events: none;
                z-index: 0;
            }
            .shell-container::after {
                content: '';
                position: absolute;
                top: 120px;
                left: -60px;
                width: 180px;
                height: 180px;
                border-radius: 50%;
                background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 70%);
                pointer-events: none;
                z-index: 0;
            }

            /* 内容区在光斑之上 */
            .shell-content { position: relative; z-index: 1; }

            /* ── 内容区 · 底部预留固定提交栏空间 ── */
            .shell-content {
                flex: 1;
                padding-bottom: 92px;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
                scroll-behavior: smooth;
            }

            /* ── 考试答题 · 页面专属动效（计时器心跳，提示考试进行中） ── */
            .exam-tick {
                animation: exam-tick 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
                transform-origin: center;
                will-change: transform, opacity;
            }
            @keyframes exam-tick {
                0%, 100% { transform: scale(1); opacity: 1; }
                50% { transform: scale(1.14); opacity: 0.8; }
            }

            /* ── 计时器 · 圆环进度（iOS 26 Liquid Glass） ── */
            .timer-ring { position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
            .timer-ring svg { transform: rotate(-90deg); }
            .timer-ring__bg { fill: none; stroke: var(--border); stroke-width: 3; opacity: 0.3; }
            .timer-ring__progress { fill: none; stroke: var(--state-error); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
            .timer-ring__text { position: absolute; font-size: 10px; font-weight: 700; color: var(--state-error); font-family: var(--font-mono); }

            /* ── 标记按钮 · Flag toggle ── */
            .flag-btn {
              width: 36px; height: 36px;
              display: flex; align-items: center; justify-content: center;
              border: none; background: transparent;
              color: var(--text-muted); cursor: pointer;
              border-radius: var(--radius-full);
              flex-shrink: 0;
              transition: color var(--ease-spring), background var(--ease-spring), transform var(--ease-spring);
            }
            .flag-btn:hover { color: var(--state-warning); background: var(--state-warning-soft); }
            .flag-btn:active { transform: scale(0.92); }
            .flag-btn--active { color: var(--state-warning); background: var(--state-warning-soft); }
            .flag-btn--active svg { fill: var(--state-warning); }

            /* ── 答题卡按钮 ── */
            .answer-card-btn {
              position: relative;
              width: 40px; height: 36px;
              display: flex; align-items: center; justify-content: center;
              gap: 2px;
              border: none; background: transparent;
              color: var(--text-secondary); cursor: pointer;
              border-radius: var(--radius-full);
              flex-shrink: 0;
              transition: color var(--ease-spring), background var(--ease-spring), transform var(--ease-spring);
            }
            .answer-card-btn:hover { color: var(--primary); background: var(--primary-soft); }
            .answer-card-btn:active { transform: scale(0.92); }
            .answer-card-btn__badge {
              position: absolute;
              bottom: 0px; right: -2px;
              min-width: 22px; height: 16px;
              padding: 0 4px;
              border-radius: var(--radius-full);
              background: var(--primary);
              color: #FFFFFF;
              font-size: 9px; font-weight: 800;
              font-variant-numeric: tabular-nums;
              display: flex; align-items: center; justify-content: center;
              line-height: 1;
              box-shadow: 0 0 0 1.5px var(--surface);
            }

            /* ═══ iOS 26 Liquid Glass · Page Component Overrides ═══ */

            /* ── 沉浸式顶栏 · Glass Header ── */
            .shell-content > header,
            .shell-content > .sticky {
                background: var(--glass-header) !important;
                backdrop-filter: blur(var(--glass-header-blur)) saturate(180%) !important;
                -webkit-backdrop-filter: blur(var(--glass-header-blur)) saturate(180%) !important;
                border-bottom-color: var(--glass-border) !important;
            }

            /* ── 题目卡片 · Glass Card ── */
            .shell-content > section[class*="rounded"] {
                background: var(--glass-card) !important;
                backdrop-filter: blur(var(--glass-card-blur)) saturate(180%) !important;
                -webkit-backdrop-filter: blur(var(--glass-card-blur)) saturate(180%) !important;
                border-color: var(--glass-border) !important;
                border-radius: var(--radius-xl) !important;
                box-shadow: var(--shadow-card), var(--glass-inner-highlight) !important;
            }

            /* ── 答题选项 · Glass Material ── */
            .shell-content button[class*="rounded"][class*="border-2"] {
                backdrop-filter: blur(var(--glass-card-blur)) saturate(180%) !important;
                -webkit-backdrop-filter: blur(var(--glass-card-blur)) saturate(180%) !important;
                border-radius: var(--radius-md) !important;
                transition: transform var(--ease-spring), border-color var(--ease-out), box-shadow var(--ease-out) !important;
            }

            /* 已答选项 · Glass highlight */
            .shell-content button[class*="rounded"][class*="border-2"][style*="primary-soft"] {
                background: rgba(16, 185, 129, 0.12) !important;
                box-shadow: 0 0 0 3px var(--primary-glow), var(--glass-inner-highlight) !important;
            }

            /* 未答选项 · Glass card */
            .shell-content button[class*="rounded"][class*="border-2"][style*="surface)"] {
                background: var(--glass-card) !important;
            }

            /* ── 选项字母圆 · 大圆 + 弹簧 ── */
            .shell-content button[class*="rounded"][class*="border-2"] span[class*="rounded-full"] {
                width: 36px !important;
                height: 36px !important;
                transition: transform var(--ease-spring) !important;
            }

            /* ── 答题卡 · Glass Card ── */
            .shell-content section[class*="rounded"][class*="border"]:not(:first-of-type) {
                background: var(--glass-card) !important;
                backdrop-filter: blur(var(--glass-card-blur)) saturate(180%) !important;
                -webkit-backdrop-filter: blur(var(--glass-card-blur)) saturate(180%) !important;
                border-color: var(--glass-border) !important;
                border-radius: var(--radius-lg) !important;
                box-shadow: var(--shadow-card), var(--glass-inner-highlight) !important;
            }

            /* ── 答题卡网格按钮 · Glass + Spring ── */
            .shell-content section[class*="rounded"][class*="border"] .grid button {
                border-radius: var(--radius-sm) !important;
                transition: transform var(--ease-spring) !important;
            }

            .shell-content section[class*="rounded"][class*="border"] .grid button:active {
                transform: scale(0.92) !important;
            }

            /* 已答按钮 · Glass inner highlight */
            .shell-content section[class*="rounded"][class*="border"] .grid button[style*="primary)"] {
                background: var(--primary) !important;
                color: #ffffff !important;
                box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3) !important;
            }

            /* 当前题 · Glow ring */
            .shell-content section[class*="rounded"][class*="border"] .grid button[style*="primary-border)"] {
                background: var(--primary) !important;
                color: #ffffff !important;
                box-shadow: 0 0 0 3px var(--primary-soft), inset 0 1px 0 rgba(255, 255, 255, 0.3) !important;
            }

            /* 未答按钮 · Glass muted */
            .shell-content section[class*="rounded"][class*="border"] .grid button[style*="surface-muted)"] {
                background: rgba(241, 245, 249, 0.5) !important;
                backdrop-filter: blur(8px) !important;
                -webkit-backdrop-filter: blur(8px) !important;
                color: var(--text-muted) !important;
            }

            /* ── 底部提交栏 · Glass Nav ── */
            .shell-container > div.fixed {
                background: var(--glass-nav) !important;
                backdrop-filter: blur(var(--glass-nav-blur)) saturate(180%) !important;
                -webkit-backdrop-filter: blur(var(--glass-nav-blur)) saturate(180%) !important;
                border-top-color: var(--glass-border) !important;
                box-shadow: 0 -2px 20px rgba(15, 23, 42, 0.06) !important;
            }

            /* ── 所有交互元素 · Spring Motion ── */
            .exam-press {
                transition: transform var(--ease-spring), background-color var(--ease-out), border-color var(--ease-out), box-shadow var(--ease-out) !important;
            }
            .exam-press:active {
                transform: scale(0.95) !important;
            }

            /* ── 查看成绩按钮 · Glass highlight ── */
            .shell-container > div.fixed button[style*="primary)"][style*="shadow-primary"] {
                box-shadow: var(--shadow-primary), var(--glass-inner-highlight) !important;
                border-radius: var(--radius-md) !important;
            }

            /* 提交栏按钮 · 胶囊圆角 */
            .shell-container > div.fixed button {
              border-radius: var(--radius-full) !important;
            }
            /* 上一题按钮 */
            .shell-container > div.fixed button[style*="surface-muted)"] {
              height: 44px !important;
              border: 1px solid var(--border) !important;
              background: transparent !important;
              color: var(--text-secondary) !important;
            }
            /* 下一题按钮 */
            .shell-container > div.fixed button[style*="border-color: var(--primary)"] {
              height: 44px !important;
              background: var(--primary-soft) !important;
              color: var(--primary) !important;
              border: 1px solid var(--primary-border) !important;
            }

            @media (prefers-reduced-motion: reduce) {
                .exam-tick { animation: none; }
                .exam-press { transition-duration: 0.01ms !important; }
                .exam-press:hover { transform: none !important; }
                * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
            }

            /* ── Dark Mode Glass ── */
            .dark .shell-content > header,
            .dark .shell-content > .sticky {
                background: var(--glass-header) !important;
            }
            .dark .shell-content > section[class*="rounded"],
            .dark .shell-content section[class*="rounded"][class*="border"] {
                background: var(--glass-card) !important;
            }
            .dark .shell-content button[class*="rounded"][class*="border-2"][style*="surface)"] {
                background: var(--glass-card) !important;
            }
            .dark .shell-container > div.fixed {
                background: var(--glass-nav) !important;
            }
        </style>

        <style>
            /* ── 提交栏 · 两区布局（左导航 / 右交卷） ── */
            .submit-bar {
              display: flex; align-items: center; gap: 8px;
              width: 100%;
            }
            .submit-bar__nav {
              display: flex; gap: 6px; flex-shrink: 0;
            }
            .submit-bar__btn {
              height: 44px; padding: 0 12px;
              display: flex; align-items: center; gap: 4px;
              border-radius: var(--radius-full);
              font-size: 13px; font-weight: 600;
              cursor: pointer;
              transition: transform var(--ease-spring), background var(--ease-spring);
            }
            .submit-bar__btn--prev {
              background: transparent;
              border: 1px solid var(--border);
              color: var(--text-secondary);
            }
            .submit-bar__btn--prev:hover { background: var(--surface-muted); }
            .submit-bar__btn--next {
              background: var(--primary-soft);
              border: 1px solid var(--primary-border);
              color: var(--primary);
            }
            .submit-bar__btn--next:hover { background: rgba(16, 185, 129, 0.15); }
            .submit-bar__btn:active { transform: scale(0.95); }
            .submit-bar__submit {
              flex: 1; height: 48px;
              display: flex; align-items: center; justify-content: center; gap: 6px;
              background: var(--primary); color: #FFFFFF;
              border: none; border-radius: var(--radius-full);
              font-size: 15px; font-weight: 700;
              cursor: pointer;
              box-shadow: var(--shadow-primary);
              transition: transform var(--ease-spring), box-shadow var(--ease-spring);
            }
            .submit-bar__submit:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(16, 185, 129, 0.25); }
            .submit-bar__submit:active { transform: scale(0.95); }
        </style>

        <div class="shell-container">
            <div class="shell-content">

                <!-- ═══ 1 · 沉浸式顶栏 ═══ -->
                <header class="sticky top-0 z-30 flex items-center gap-2 px-3 py-3 bg-[var(--surface)] border-b border-[var(--border)]">
                    <!-- 返回 -->
                    <button type="button" data-dom-id="btn-back" aria-label="返回"
                        class="exam-press flex items-center justify-center w-9 h-9 -ml-1 rounded-[8px] text-[var(--text-secondary)] transition hover:bg-[var(--surface-muted)] active:scale-95">
                        <i data-lucide="arrow-left" class="w-5 h-5"></i>
                    </button>
                    <!-- 标题 + 计数 -->
                    <div class="flex-1 min-w-0 flex flex-col items-center text-center">
                        <span class="text-[14px] font-bold text-[var(--text-primary)] truncate whitespace-nowrap">计算机基础期末考试</span>
                        <span class="text-[12px] text-[var(--text-muted)] tabular-nums whitespace-nowrap">第 8 题 / 共 20 题</span>
                    </div>
                    <!-- 答题卡按钮 -->
                    <button type="button" data-dom-id="btn-answer-card" class="exam-press answer-card-btn" aria-label="答题卡" onclick="document.getElementById('examAnswerSheet').classList.add('answer-sheet--open')">
                        <i data-lucide="layout-grid" class="w-5 h-5"></i>
                        <span class="answer-card-btn__badge">8/20</span>
                    </button>
                    <!-- 标记题目 -->
                    <button type="button" data-dom-id="btn-flag" class="exam-press flag-btn flag-btn--active" aria-label="标记此题">
                        <i data-lucide="flag" class="w-5 h-5"></i>
                    </button>
                    <!-- 计时器 · 圆环进度 -->
                    <div class="timer-ring">
                        <svg width="44" height="44" viewBox="0 0 44 44">
                            <circle class="timer-ring__bg" cx="22" cy="22" r="18"/>
                            <circle class="timer-ring__progress" cx="22" cy="22" r="18" stroke-dasharray="113.1" stroke-dashoffset="28.3"/>
                        </svg>
                        <span class="timer-ring__text">45:30</span>
                    </div>
                </header>

                <!-- ═══ 2 · 题目卡片 ═══ -->
                <section class="mx-4 mt-4 p-5 bg-[var(--surface)] rounded-[16px] border border-[var(--border)]">
                    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-[12px] font-bold whitespace-nowrap"
                          style="background: var(--primary-soft); color: var(--primary);">单选题</span>
                    <p class="mt-3 text-[16px] font-medium text-[var(--text-primary)]" style="line-height: 1.6;">
                        在计算机网络中，TCP协议的三次握手过程中，第二次握手报文的标志位（Flags）应该设置为以下哪个？
                    </p>
                    <div class="mt-3 flex items-center gap-2 text-[12px]">
                        <span style="display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--radius-full); background: var(--surface-muted); color: var(--text-muted);">
                          <i data-lucide="award" style="width: 12px; height: 12px;"></i>2分
                        </span>
                        <span style="display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--radius-full); background: var(--state-warning-soft); color: var(--state-warning);">
                          <i data-lucide="zap" style="width: 12px; height: 12px;"></i>中等
                        </span>
                        <span style="display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--radius-full); background: var(--surface-muted); color: var(--text-muted);">
                          <i data-lucide="wifi" style="width: 12px; height: 12px;"></i>计算机网络
                        </span>
                    </div>
                </section>

                <!-- ═══ 3 · 答题选项 ═══ -->
                <div class="mt-4 px-4 flex flex-col gap-[10px]">
                    <!-- A · 用户选中（蓝色高亮） -->
                    <button type="button" data-dom-id="exam-option-a"
                        class="exam-press flex items-center gap-3 w-full p-3 rounded-[12px] border-2 text-left transition active:scale-[0.99]"
                        style="border-color: var(--state-info); background: var(--state-info-soft);">
                        <span class="flex items-center justify-center w-8 h-8 rounded-full text-[13px] font-bold flex-shrink-0 text-white"
                              style="background: var(--state-info);">A</span>
                        <span class="flex-1 min-w-0 text-[14px] font-medium text-[var(--text-primary)]">SYN=1, ACK=0</span>
                        <i data-lucide="circle" class="w-4 h-4 flex-shrink-0" style="color: var(--state-info);"></i>
                    </button>
                    <!-- B · 正确答案（绿色高亮 + 勾选） -->
                    <button type="button" data-dom-id="exam-option-b"
                        class="exam-press flex items-center gap-3 w-full p-3 rounded-[12px] border-2 text-left transition active:scale-[0.99]"
                        style="border-color: var(--primary); background: var(--primary-soft);">
                        <span class="flex items-center justify-center w-8 h-8 rounded-full text-[13px] font-bold flex-shrink-0 text-white"
                              style="background: var(--primary);">B</span>
                        <span class="flex-1 min-w-0 text-[14px] font-medium text-[var(--text-primary)]">SYN=1, ACK=1</span>
                        <i data-lucide="check" class="w-4 h-4 flex-shrink-0" style="color: var(--primary);"></i>
                    </button>
                    <!-- C -->
                    <button type="button" data-dom-id="exam-option-c"
                        class="exam-press flex items-center gap-3 w-full p-3 rounded-[12px] border-2 text-left transition hover:bg-[var(--surface-muted)] active:scale-[0.99]"
                        style="border-color: var(--border); background: var(--surface);">
                        <span class="flex items-center justify-center w-8 h-8 rounded-full border-2 text-[13px] font-bold flex-shrink-0"
                              style="border-color: var(--border-strong); color: var(--text-secondary);">C</span>
                        <span class="flex-1 min-w-0 text-[14px] text-[var(--text-primary)]">SYN=0, ACK=1</span>
                    </button>
                    <!-- D -->
                    <button type="button" data-dom-id="exam-option-d"
                        class="exam-press flex items-center gap-3 w-full p-3 rounded-[12px] border-2 text-left transition hover:bg-[var(--surface-muted)] active:scale-[0.99]"
                        style="border-color: var(--border); background: var(--surface);">
                        <span class="flex items-center justify-center w-8 h-8 rounded-full border-2 text-[13px] font-bold flex-shrink-0"
                              style="border-color: var(--border-strong); color: var(--text-secondary);">D</span>
                        <span class="flex-1 min-w-0 text-[14px] text-[var(--text-primary)]">SYN=0, ACK=0</span>
                    </button>
                </div>

            </div>

            <!-- ═══ 5 · 底部固定提交栏（沉浸式 · 无主导航） ═══ -->
            <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[420px] z-40 px-3 py-3 bg-[var(--surface)] border-t border-[var(--border)]"
                 style="box-shadow: 0 -2px 8px rgba(15, 23, 42, 0.05);">
                <div class="submit-bar">
                    <div class="submit-bar__nav">
                        <button type="button" data-dom-id="btn-prev" class="exam-press submit-bar__btn submit-bar__btn--prev">
                            <i data-lucide="chevron-left" class="w-4 h-4"></i>
                            <span>上一题</span>
                        </button>
                        <button type="button" data-dom-id="btn-next" class="exam-press submit-bar__btn submit-bar__btn--next">
                            <span>下一题</span>
                            <i data-lucide="chevron-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <button type="button" data-dom-id="cta-view-profile" class="exam-press submit-bar__submit">
                        <i data-lucide="check" class="w-4 h-4"></i>
                        <span>交卷</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- ═══ 答题卡弹出层 ═══ -->
    <div class="answer-sheet" id="examAnswerSheet">
      <div class="answer-sheet__backdrop" onclick="document.getElementById('examAnswerSheet').classList.remove('answer-sheet--open')"></div>
      <div class="answer-sheet__panel">
        <div class="answer-sheet__handle"></div>
        <div class="answer-sheet__header">
          <h2 class="answer-sheet__title">答题卡</h2>
          <span class="answer-sheet__count">共 20 题</span>
        </div>
        <div class="answer-sheet__progress">
          <div class="answer-sheet__progress-track">
            <div class="answer-sheet__progress-fill" style="width: 40%;"></div>
          </div>
          <span class="answer-sheet__progress-label">完成 40%</span>
        </div>
        <div class="answer-sheet__grid">
          <button type="button" class="as-q as-q--done">1</button>
          <button type="button" class="as-q as-q--done">2</button>
          <button type="button" class="as-q as-q--done as-q--flagged">3</button>
          <button type="button" class="as-q as-q--done">4</button>
          <button type="button" class="as-q as-q--done">5</button>
          <button type="button" class="as-q as-q--done">6</button>
          <button type="button" class="as-q as-q--done">7</button>
          <button type="button" class="as-q as-q--current">8</button>
          <button type="button" class="as-q">9</button>
          <button type="button" class="as-q">10</button>
          <button type="button" class="as-q">11</button>
          <button type="button" class="as-q as-q--flagged">12</button>
          <button type="button" class="as-q">13</button>
          <button type="button" class="as-q">14</button>
          <button type="button" class="as-q">15</button>
          <button type="button" class="as-q">16</button>
          <button type="button" class="as-q">17</button>
          <button type="button" class="as-q">18</button>
          <button type="button" class="as-q">19</button>
          <button type="button" class="as-q">20</button>
        </div>
        <div class="answer-sheet__legend">
          <span class="as-legend"><span class="as-legend__dot as-legend__dot--done"></span>已答 7</span>
          <span class="as-legend"><span class="as-legend__dot as-legend__dot--current"></span>当前</span>
          <span class="as-legend"><span class="as-legend__dot as-legend__dot--flagged"></span>已标记 2</span>
          <span class="as-legend"><span class="as-legend__dot"></span>未答 12</span>
        </div>
        <button type="button" data-dom-id="as-close" class="answer-sheet__close" onclick="document.getElementById('examAnswerSheet').classList.remove('answer-sheet--open')">关闭</button>
      </div>
    </div>

    <style>
      /* ── 答题卡弹出层 · iOS 26 Liquid Glass Bottom Sheet ── */
      .answer-sheet {
        position: fixed; inset: 0; z-index: 100;
        visibility: hidden;
        opacity: 0;
        transition: visibility 0s 0.3s, opacity 0.3s ease;
      }
      .answer-sheet--open {
        visibility: visible;
        opacity: 1;
        transition: visibility 0s, opacity 0.3s ease;
      }
      .answer-sheet__backdrop {
        position: absolute; inset: 0;
        background: rgba(15, 23, 42, 0.4);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }
      .answer-sheet__panel {
        position: absolute; bottom: 0; left: 50%;
        transform: translateX(-50%) translateY(100%);
        width: 100%; max-width: 420px;
        max-height: 80vh; overflow-y: auto;
        background: var(--glass-overlay);
        backdrop-filter: blur(var(--glass-overlay-blur)) saturate(180%);
        -webkit-backdrop-filter: blur(var(--glass-overlay-blur)) saturate(180%);
        border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        border-top: 1px solid var(--glass-border);
        border-left: 1px solid var(--glass-border);
        border-right: 1px solid var(--glass-border);
        box-shadow: 0 -8px 40px rgba(15, 23, 42, 0.15);
        padding: 8px 20px 24px;
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .answer-sheet--open .answer-sheet__panel {
        transform: translateX(-50%) translateY(0);
      }
      .answer-sheet__handle {
        width: 36px; height: 4px;
        border-radius: var(--radius-full);
        background: var(--border-strong);
        margin: 0 auto 16px;
      }
      .answer-sheet__header {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 12px;
      }
      .answer-sheet__title {
        font-size: 18px; font-weight: 800;
        color: var(--text-primary);
        font-family: var(--font-display);
        margin: 0;
      }
      .answer-sheet__count {
        font-size: 13px; font-weight: 600;
        color: var(--text-muted);
      }
      .answer-sheet__progress {
        display: flex; align-items: center; gap: 8px;
        margin-bottom: 16px;
      }
      .answer-sheet__progress-track {
        flex: 1; height: 4px;
        background: var(--surface-muted);
        border-radius: var(--radius-full);
        overflow: hidden;
      }
      .answer-sheet__progress-fill {
        height: 100%; background: var(--primary);
        border-radius: var(--radius-full);
      }
      .answer-sheet__progress-label {
        font-size: 11px; font-weight: 700;
        color: var(--primary);
        white-space: nowrap;
      }
      .answer-sheet__grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        margin-bottom: 16px;
      }
      .as-q {
        width: 100%; aspect-ratio: 1;
        border: 1px solid var(--border);
        background: var(--surface-muted);
        color: var(--text-muted);
        border-radius: var(--radius-sm);
        font-size: 13px; font-weight: 700;
        font-variant-numeric: tabular-nums;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: transform var(--ease-spring), background var(--ease-spring), border-color var(--ease-spring);
      }
      .as-q:active { transform: scale(0.92); }
      .as-q--done {
        background: var(--primary); color: #FFFFFF;
        border-color: var(--primary);
      }
      .as-q--current {
        background: var(--primary); color: #FFFFFF;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-glow);
      }
      .as-q--flagged { position: relative; }
      .as-q--flagged::after {
        content: '';
        position: absolute; top: 3px; right: 3px;
        width: 6px; height: 6px;
        border-radius: 50%;
        background: var(--state-warning);
      }
      .answer-sheet__legend {
        display: flex; flex-wrap: wrap; gap: 12px;
        margin-bottom: 16px;
        font-size: 12px; color: var(--text-secondary);
      }
      .as-legend {
        display: inline-flex; align-items: center; gap: 5px;
      }
      .as-legend__dot {
        width: 10px; height: 10px;
        border-radius: 3px;
        background: var(--surface-muted);
        border: 1px solid var(--border);
      }
      .as-legend__dot--done { background: var(--primary); border-color: var(--primary); }
      .as-legend__dot--current { background: var(--primary); border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-glow); }
      .as-legend__dot--flagged { background: var(--surface-muted); position: relative; }
      .as-legend__dot--flagged::after {
        content: ''; position: absolute; top: 1px; right: 1px;
        width: 4px; height: 4px; border-radius: 50%; background: var(--state-warning);
      }
      .answer-sheet__close {
        width: 100%; height: 44px;
        background: var(--surface-muted);
        border: 1px solid var(--border);
        border-radius: var(--radius-full);
        color: var(--text-secondary);
        font-size: 15px; font-weight: 600;
        cursor: pointer;
        transition: background var(--ease-spring), transform var(--ease-spring);
      }
      .answer-sheet__close:active { transform: scale(0.98); background: var(--border-soft); }
    </style>
    <script>lucide.createIcons();</script>
</body>
</html>
