/* ═══════════════════════════════════════════════════════════════
   Design System — 考试学习平台
   清新活力 · iOS 26 Liquid Glass
   Translucent materials, frosted glass, spring motion, generous radii.
   ═══════════════════════════════════════════════════════════════ */

:root {
  /* ── Brand Primary · Emerald Green ── */
  --primary: #10B981;
  --primary-strong: #059669;
  --primary-soft: #ECFDF5;
  --primary-border: #A7F3D0;
  --primary-glow: rgba(16, 185, 129, 0.2);

  /* ── Surfaces · iOS 26 Liquid Glass ── */
  --bg: #F2F4F8;
  --surface: #FFFFFF;
  --surface-muted: #F1F5F9;
  --surface-elevated: #FFFFFF;

  /* ── Glass Materials (Liquid Glass核心) ── */
  --glass-nav: rgba(255, 255, 255, 0.72);
  --glass-nav-blur: 24px;
  --glass-card: rgba(255, 255, 255, 0.65);
  --glass-card-blur: 20px;
  --glass-header: rgba(255, 255, 255, 0.68);
  --glass-header-blur: 20px;
  --glass-overlay: rgba(255, 255, 255, 0.55);
  --glass-overlay-blur: 40px;
  --glass-highlight: rgba(255, 255, 255, 0.5);
  --glass-border: rgba(255, 255, 255, 0.6);

  /* ── Text ── */
  --text-primary: #0F172A;
  --text-secondary: #475569;
  --text-muted: #94A3B8;
  --text-placeholder: #CBD5E1;

  /* ── Borders ── */
  --border: #E2E8F0;
  --border-soft: #F1F5F9;
  --border-strong: #CBD5E1;

  /* ── State Colors (semantic only, not identity) ── */
  --state-success: #10B981;
  --state-success-soft: #ECFDF5;
  --state-warning: #F59E0B;
  --state-warning-soft: #FFFBEB;
  --state-warning-border: #FDE68A;
  --state-error: #EF4444;
  --state-error-soft: #FEF2F2;
  --state-error-border: #FECACA;
  --state-info: #3B82F6;
  --state-info-soft: #EFF6FF;

  /* ── Radii · iOS 26 generous scale ── */
  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-lg: 20px;
  --radius-xl: 24px;
  --radius-full: 9999px;

  /* ── Shadows · Liquid Glass depth ── */
  --shadow-xs: 0 1px 3px rgba(15, 23, 42, 0.04);
  --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
  --shadow-card: 0 4px 16px rgba(15, 23, 42, 0.06);
  --shadow-elevated: 0 8px 32px rgba(15, 23, 42, 0.10);
  --shadow-modal: 0 24px 64px rgba(15, 23, 42, 0.18);
  --shadow-primary: 0 8px 24px rgba(16, 185, 129, 0.22);
  --glass-inner-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.5);

  /* ── Typography ── */
  --font-sans: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-display: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Consolas, monospace;

  /* ── Font sizes ── */
  --text-xs: 0.6875rem;    /* 11px */
  --text-sm: 0.8125rem;   /* 13px */
  --text-md: 0.875rem;    /* 14px */
  --text-base: 0.9375rem;  /* 15px */
  --text-lg: 1.125rem;    /* 18px */
  --text-xl: 1.375rem;    /* 22px */
  --text-2xl: 1.75rem;    /* 28px */

  /* ── Spacing ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;

  /* ── Transitions · iOS 26 Spring Motion ── */
  --ease-out: 0.28s cubic-bezier(0.32, 0.72, 0, 1);
  --ease-spring: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-spring-gentle: 0.35s cubic-bezier(0.25, 1, 0.5, 1);
  --ease-bounce: 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

/* ── Dark Mode · iOS 26 ── */
.dark {
  --bg: #000000;
  --surface: #1C1C1E;
  --surface-muted: #2C2C2E;
  --surface-elevated: #1C1C1E;

  --glass-nav: rgba(28, 28, 30, 0.72);
  --glass-card: rgba(44, 44, 46, 0.65);
  --glass-header: rgba(28, 28, 30, 0.68);
  --glass-overlay: rgba(28, 28, 30, 0.55);
  --glass-highlight: rgba(255, 255, 255, 0.08);
  --glass-border: rgba(255, 255, 255, 0.12);

  --text-primary: #F1F5F9;
  --text-secondary: #CBD5E1;
  --text-muted: #64748B;
  --text-placeholder: #475569;

  --border: #3A3A3C;
  --border-soft: #2C2C2E;
  --border-strong: #475569;

  --primary-soft: #064E3B;
  --primary-border: #065F46;

  --state-success-soft: #064E3B;
  --state-warning-soft: #451A03;
  --state-warning-border: #78350F;
  --state-error-soft: #450A0A;
  --state-error-border: #7F1D1D;
  --state-info-soft: #172554;

  --shadow-xs: 0 1px 3px rgba(0, 0, 0, 0.3);
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.3);
  --glass-inner-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.06);
}

/* ═══════════════════════════════════════════════════════════════
   Typography Classes
   ═══════════════════════════════════════════════════════════════ */

.ep-display {
  font-family: var(--font-display);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.2;
  color: var(--text-primary);
}

.ep-h1 {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.25;
  color: var(--text-primary);
}

.ep-h2 {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 800;
  letter-spacing: -0.01em;
  line-height: 1.3;
  color: var(--text-primary);
}

.ep-h3 {
  font-family: var(--font-sans);
  font-size: var(--text-lg);
  font-weight: 700;
  line-height: 1.35;
  color: var(--text-primary);
}

.ep-body {
  font-family: var(--font-sans);
  font-size: var(--text-base);
  font-weight: 400;
  line-height: 1.5;
  color: var(--text-secondary);
}

.ep-body-sm {
  font-family: var(--font-sans);
  font-size: var(--text-sm);
  font-weight: 400;
  line-height: 1.5;
  color: var(--text-secondary);
}

.ep-caption {
  font-family: var(--font-sans);
  font-size: var(--text-xs);
  font-weight: 600;
  line-height: 1.4;
  color: var(--text-muted);
}

.ep-label {
  font-family: var(--font-sans);
  font-size: var(--text-xs);
  font-weight: 700;
  line-height: 1.3;
  letter-spacing: 0.02em;
  color: var(--text-muted);
  text-transform: uppercase;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>

    --color-primary: var(--text-primary);

  @layer base {
    body { background: var(--text-background); color: var(--text-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }

  }

        mask-position: center;

      }

</head>

<!-- ═══════════════════════════════════════════════════════════════
     Shell CSS · 自包含样式（来自 project-shell.html）
     放置于 <body> 内（Free-Explore 模式规则）
     ═══════════════════════════════════════════════════════════════ -->
<style>
  /* ═══════════════════════════════════════════════════════════════
     PART 1 · Shell CSS · iOS 26 Liquid Glass Floating Capsule Nav
     ═══════════════════════════════════════════════════════════════ */

  /* ── 1.1 基础重置 ── */
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0; padding: 0;
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── 1.2 应用容器 ── */
  .shell-container {
    position: relative;
    display: flex;
    flex-direction: column;
    max-width: 420px;
    min-height: 100vh;
    margin: 0 auto;
    background: var(--bg);
    box-shadow: 0 0 40px rgba(15, 23, 42, 0.10);
    overflow: hidden;
  }

  /* ── 1.2b 装饰性背景光斑 · iOS 26 深度感 ──
     两个模糊渐变光斑固定在容器顶部，透过玻璃卡片产生色彩折射。 */
  .shell-container::before {
    content: '';
    position: absolute;
    top: -60px;
    right: -40px;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  .shell-container::after {
    content: '';
    position: absolute;
    top: 120px;
    left: -60px;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* 内容区在光斑之上 */
  .shell-content { position: relative; z-index: 1; }
  .bottom-nav { z-index: 50; }

  /* ── 1.3 内容区 · 底部预留悬浮导航空间 ── */
  .shell-content {
    flex: 1;
    padding-bottom: 96px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
  }

  /* ═══════════════════════════════════════════════════════════════
     1.4 底部悬浮胶囊导航 · iOS 26 Liquid Glass Floating Capsule
     ─────────────────────────────────────────────────────────────────
     核心特征：
     · 悬浮于内容之上，不贴底边（bottom: 20px）
     · 左右留边距（width: calc(100% - 32px)）
     · 胶囊外形（border-radius: 9999px）
     · 液态玻璃材质（半透明 + 模糊 + 饱和度增强 + 内高光）
     · 选中项有玻璃透镜高亮（glass lens blob）
     ═══════════════════════════════════════════════════════════════ */
  .bottom-nav {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 388px;
    height: 64px;
    background: var(--glass-nav);
    backdrop-filter: blur(var(--glass-nav-blur)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--glass-nav-blur)) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 9999px;
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    padding: 6px;
    gap: 2px;
    z-index: 50;
    box-shadow:
      0 8px 32px rgba(15, 23, 42, 0.12),
      0 2px 8px rgba(15, 23, 42, 0.06),
      var(--glass-inner-highlight);
  }

  /* ── 1.5 单个标签 ──
     胶囊内等分；选中项有玻璃透镜背景。 */
  .nav-item {
    flex: 1;
    height: 52px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    background: transparent;
    border: none;
    border-radius: 9999px;
    color: var(--text-muted);
    font-family: var(--font-sans);
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
    position: relative;
    transition: color var(--ease-out), background var(--ease-spring), box-shadow var(--ease-spring);
  }

  .nav-item:active {
    transform: scale(0.92);
  }

  .nav-item svg {
    width: 22px;
    height: 22px;
    stroke-width: 2;
    transition: transform var(--ease-spring);
  }

  /* ── 1.6 选中态 · Glass Lens 透镜高亮 ──
     iOS 26 标志性效果：选中项背后出现玻璃透镜圆角矩形 */
  .nav-item.active,
  .nav-item[data-active="true"] {
    color: var(--primary);
    background: rgba(16, 185, 129, 0.12);
    box-shadow:
      inset 0 0 0 1px rgba(16, 185, 129, 0.15),
      var(--glass-inner-highlight);
  }

  .nav-item.active svg,
  .nav-item[data-active="true"] svg {
    transform: scale(1.1);
  }

  /* ── 1.7 强调标签 · 导入 ──
     不再凸出导航栏；改为胶囊内的实心圆形图标按钮。 */
  .nav-item--emphasis {
    flex: 0 0 auto;
    width: 52px;
  }

  .nav-emphasis-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--primary);
    color: #FFFFFF;
    box-shadow:
      0 4px 12px rgba(16, 185, 129, 0.30),
      var(--glass-inner-highlight);
    transition: box-shadow var(--ease-out), transform var(--ease-spring);
  }

  .nav-item--emphasis:active .nav-emphasis-badge {
    transform: scale(0.90);
  }

  .nav-emphasis-badge svg {
    width: 20px;
    height: 20px;
    stroke-width: 2.5;
  }

  /* 强调标签选中态 · 玻璃透镜环 */
  .nav-item--emphasis.active,
  .nav-item--emphasis[data-active="true"] {
    background: rgba(16, 185, 129, 0.12);
    box-shadow:
      inset 0 0 0 1px rgba(16, 185, 129, 0.15),
      var(--glass-inner-highlight);
  }

  .nav-item--emphasis.active .nav-emphasis-badge,
  .nav-item--emphasis[data-active="true"] .nav-emphasis-badge {
    box-shadow:
      0 4px 12px rgba(16, 185, 129, 0.30),
      0 0 0 3px var(--primary-soft),
      var(--glass-inner-highlight);
  }

  /* ── 1.8 标签文字 ── */
  .nav-label {
    font-family: var(--font-sans);
    font-size: 10px;
    font-weight: 600;
    line-height: 1;
  }

  /* ═══════════════════════════════════════════════════════════════
     Dark Mode 深色模式
     ═══════════════════════════════════════════════════════════════ */
  .dark .bottom-nav {
    background: var(--glass-nav);
    backdrop-filter: blur(var(--glass-nav-blur)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--glass-nav-blur)) saturate(180%);
    border-color: var(--glass-border);
  }

  .dark .nav-item.active,
  .dark .nav-item[data-active="true"] {
    background: rgba(16, 185, 129, 0.18);
    box-shadow: inset 0 0 0 1px rgba(16, 185, 129, 0.20), var(--glass-inner-highlight);
  }

  .dark .nav-emphasis-badge {
    box-shadow: 0 4px 14px rgba(16, 185, 129, 0.50), var(--glass-inner-highlight);
  }

  .dark .nav-item--emphasis.active .nav-emphasis-badge,
  .dark .nav-item--emphasis[data-active="true"] .nav-emphasis-badge {
    box-shadow: 0 4px 14px rgba(16, 185, 129, 0.50), 0 0 0 3px var(--primary-soft), var(--glass-inner-highlight);
  }
</style>

<!-- ═══════════════════════════════════════════════════════════════
     Page-Specific CSS · 我的 (Mine) · iOS 26 Liquid Glass
     覆盖内联样式以应用液态玻璃材质与弹簧动效。
     仅修改 <style> 块内 CSS 值；未改动任何 HTML 结构 / 文本 / data-dom-id。
     ═══════════════════════════════════════════════════════════════ -->
<style>
  /* ── 1 · Profile Header (gradient) ──
     保留渐变；底部圆角加大至 --radius-xl，并叠加底部玻璃内高光。 */
  .shell-content > section:first-child {
    border-radius: 0 0 var(--radius-xl) var(--radius-xl) !important;
    box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.25) !important;
  }

  /* ── 2 · Achievement Stats Card (overlapping) · Liquid Glass ── */
  .shell-content > section:nth-child(2) > div {
    background: var(--glass-card) !important;
    backdrop-filter: blur(var(--glass-card-blur)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--glass-card-blur)) saturate(180%);
    box-shadow: var(--shadow-elevated), var(--glass-inner-highlight) !important;
    border-radius: var(--radius-lg) !important;
    border-color: var(--glass-border) !important;
    transition: transform var(--ease-spring), box-shadow var(--ease-spring) !important;
  }
  .shell-content > section:nth-child(2) > div:hover {
    transform: translateY(-2px) !important;
  }

  /* ── 3 · Quick Menu Grid Cards · Liquid Glass ── */
  .quick-card {
    -webkit-appearance: none;
    appearance: none;
    background: var(--glass-card) !important;
    backdrop-filter: blur(var(--glass-card-blur)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--glass-card-blur)) saturate(180%);
    border-radius: var(--radius-lg) !important;
    border-color: var(--glass-border) !important;
    box-shadow: var(--shadow-card), var(--glass-inner-highlight) !important;
    transition: transform var(--ease-spring), box-shadow var(--ease-spring) !important;
  }
  .quick-card:hover {
    transform: translateY(-2px) !important;
    box-shadow: var(--shadow-elevated), var(--glass-inner-highlight) !important;
  }
  .quick-card:active {
    transform: scale(0.97) !important;
  }
  .quick-card:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }

  /* Quick menu icon circles: 52px + spring transition */
  .quick-card > div:first-child {
    width: 52px !important;
    height: 52px !important;
    transition: transform var(--ease-spring) !important;
  }
  .quick-card:hover > div:first-child {
    transform: scale(1.06);
  }
  .quick-card:active > div:first-child {
    transform: scale(0.96);
  }

  /* ── 4 · Menu List Card · Liquid Glass ── */
  .shell-content > section:nth-child(4) > div {
    background: var(--glass-card) !important;
    backdrop-filter: blur(var(--glass-card-blur)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--glass-card-blur)) saturate(180%);
    border-radius: var(--radius-lg) !important;
    border-color: var(--glass-border) !important;
    box-shadow: var(--shadow-card), var(--glass-inner-highlight) !important;
  }

  /* Menu list icon circles: 40px */
  .menu-row > div:first-child {
    width: 40px !important;
    height: 40px !important;
    transition: transform var(--ease-spring) !important;
  }

  /* Menu rows: spring transition + scale(0.98) active + hover bg */
  .menu-row {
    -webkit-appearance: none;
    appearance: none;
    transition: background-color var(--ease-spring), transform var(--ease-spring) !important;
  }
  .menu-row:hover {
    background-color: var(--surface-muted) !important;
  }
  .menu-row:active {
    transform: scale(0.98) !important;
    background-color: var(--surface-muted) !important;
  }
  .menu-row:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: -2px;
  }

  /* ── 4b · Menu Group Titles ──
     分组小标题，将菜单列表划分为「学习工具」与「系统」两个逻辑区块。 */
  .menu-group-title {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-secondary);
    padding: 4px 12px;
    margin-top: 24px;
    margin-bottom: 10px;
    margin-left: 4px;
    background: var(--surface-muted);
    border-radius: var(--radius-full);
  }
  .menu-group-title:first-child {
    margin-top: 0;
  }
  .menu-group-title::before {
    content: '';
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--primary);
    flex-shrink: 0;
  }

  /* ── 4c · Dark Mode Toggle Switch ──
     iOS 风格开关，静态展示 off 状态。 */
  .menu-row:has(div[style*="border-strong"]) > div:last-child {
    transition: background var(--ease-spring) !important;
  }

  /* ── 4d · 主题颜色弹出层 ── */
  .theme-sheet {
    position: fixed; inset: 0; z-index: 100;
    visibility: hidden;
    opacity: 0;
    transition: visibility 0s 0.3s, opacity 0.3s ease;
  }
  .theme-sheet--open {
    visibility: visible;
    opacity: 1;
    transition: visibility 0s, opacity 0.3s ease;
  }
  .theme-sheet__backdrop {
    position: absolute; inset: 0;
    background: rgba(15, 23, 42, 0.4);
    backdrop-filter: blur(4px);

<script>
  // ── 主题颜色 ──
  document.querySelectorAll('.theme-option').forEach(function(option) {
    option.addEventListener('click', function() {
      // 移除所有 active
      document.querySelectorAll('.theme-option').forEach(function(o) {
        o.classList.remove('theme-option--active');
      });
      // 设置当前
      option.classList.add('theme-option--active');
      // 覆盖 CSS 变量
      var root = document.documentElement;
      root.style.setProperty('--primary', option.dataset.primary);
      root.style.setProperty('--primary-strong', option.dataset.strong);
      root.style.setProperty('--primary-soft', option.dataset.soft);
      root.style.setProperty('--primary-border', option.dataset.border);
      root.style.setProperty('--primary-glow', option.dataset.glow);
      // 更新菜单行预览圆点
      var dot = document.getElementById('currentThemeDot');
      if (dot) {
        dot.style.background = option.dataset.primary;
      }
      // 关闭弹出层
      document.getElementById('themeSheet').classList.remove('theme-sheet--open');
    });
  });
</script>
