/* ═══════════════════════════════════════════════════════════════
   Design System — 考试学习平台
   清新活力 · iOS 26 Liquid Glass
   Translucent materials, frosted glass, spring motion, generous radii.
   ═══════════════════════════════════════════════════════════════ */

:root {
  /* ── Brand Primary · Emerald Green ── */
  --primary: #10B981;
  --primary-strong: #059669;
  --primary-soft: #ECFDF5;
  --primary-border: #A7F3D0;
  --primary-glow: rgba(16, 185, 129, 0.2);

  /* ── Surfaces · iOS 26 Liquid Glass ── */
  --bg: #F2F4F8;
  --surface: #FFFFFF;
  --surface-muted: #F1F5F9;
  --surface-elevated: #FFFFFF;

  /* ── Glass Materials (Liquid Glass核心) ── */
  --glass-nav: rgba(255, 255, 255, 0.72);
  --glass-nav-blur: 24px;
  --glass-card: rgba(255, 255, 255, 0.65);
  --glass-card-blur: 20px;
  --glass-header: rgba(255, 255, 255, 0.68);
  --glass-header-blur: 20px;
  --glass-overlay: rgba(255, 255, 255, 0.55);
  --glass-overlay-blur: 40px;
  --glass-highlight: rgba(255, 255, 255, 0.5);
  --glass-border: rgba(255, 255, 255, 0.6);

  /* ── Text ── */
  --text-primary: #0F172A;
  --text-secondary: #475569;
  --text-muted: #94A3B8;
  --text-placeholder: #CBD5E1;

  /* ── Borders ── */
  --border: #E2E8F0;
  --border-soft: #F1F5F9;
  --border-strong: #CBD5E1;

  /* ── State Colors (semantic only, not identity) ── */
  --state-success: #10B981;
  --state-success-soft: #ECFDF5;
  --state-warning: #F59E0B;
  --state-warning-soft: #FFFBEB;
  --state-warning-border: #FDE68A;
  --state-error: #EF4444;
  --state-error-soft: #FEF2F2;
  --state-error-border: #FECACA;
  --state-info: #3B82F6;
  --state-info-soft: #EFF6FF;

  /* ── Radii · iOS 26 generous scale ── */
  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-lg: 20px;
  --radius-xl: 24px;
  --radius-full: 9999px;

  /* ── Shadows · Liquid Glass depth ── */
  --shadow-xs: 0 1px 3px rgba(15, 23, 42, 0.04);
  --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
  --shadow-card: 0 4px 16px rgba(15, 23, 42, 0.06);
  --shadow-elevated: 0 8px 32px rgba(15, 23, 42, 0.10);
  --shadow-modal: 0 24px 64px rgba(15, 23, 42, 0.18);
  --shadow-primary: 0 8px 24px rgba(16, 185, 129, 0.22);
  --glass-inner-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.5);

  /* ── Typography ── */
  --font-sans: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-display: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Consolas, monospace;

  /* ── Font sizes ── */
  --text-xs: 0.6875rem;    /* 11px */
  --text-sm: 0.8125rem;   /* 13px */
  --text-md: 0.875rem;    /* 14px */
  --text-base: 0.9375rem;  /* 15px */
  --text-lg: 1.125rem;    /* 18px */
  --text-xl: 1.375rem;    /* 22px */
  --text-2xl: 1.75rem;    /* 28px */

  /* ── Spacing ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;

  /* ── Transitions · iOS 26 Spring Motion ── */
  --ease-out: 0.28s cubic-bezier(0.32, 0.72, 0, 1);
  --ease-spring: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-spring-gentle: 0.35s cubic-bezier(0.25, 1, 0.5, 1);
  --ease-bounce: 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

/* ── Dark Mode · iOS 26 ── */
.dark {
  --bg: #000000;
  --surface: #1C1C1E;
  --surface-muted: #2C2C2E;
  --surface-elevated: #1C1C1E;

  --glass-nav: rgba(28, 28, 30, 0.72);
  --glass-card: rgba(44, 44, 46, 0.65);
  --glass-header: rgba(28, 28, 30, 0.68);
  --glass-overlay: rgba(28, 28, 30, 0.55);
  --glass-highlight: rgba(255, 255, 255, 0.08);
  --glass-border: rgba(255, 255, 255, 0.12);

  --text-primary: #F1F5F9;
  --text-secondary: #CBD5E1;
  --text-muted: #64748B;
  --text-placeholder: #475569;

  --border: #3A3A3C;
  --border-soft: #2C2C2E;
  --border-strong: #475569;

  --primary-soft: #064E3B;
  --primary-border: #065F46;

  --state-success-soft: #064E3B;
  --state-warning-soft: #451A03;
  --state-warning-border: #78350F;
  --state-error-soft: #450A0A;
  --state-error-border: #7F1D1D;
  --state-info-soft: #172554;

  --shadow-xs: 0 1px 3px rgba(0, 0, 0, 0.3);
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.3);
  --glass-inner-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.06);
}

/* ═══════════════════════════════════════════════════════════════
   Typography Classes
   ═══════════════════════════════════════════════════════════════ */

.ep-display {

.ep-h2 {

}

.ep-h3 {
  font-family: var(--font-sans);

.ep-body {

}

.ep-body-sm {
  font-family: var(--font-sans);

  line-height: 1.5;
  color: var(--text-secondary);
}

.ep-caption {

.ep-label {

  color: var(--text-muted);
  text-transform: uppercase;
}

    </style>

      }
    </style>
</head>

<!-- ═══════════════════════════════════════════════════════════════
     Shell CSS · 自包含样式（来自 project-shell.html）
     放置于 <body> 内（Free-Explore 模式规则）
     ═══════════════════════════════════════════════════════════════ -->
<style>
  /* ═══════════════════════════════════════════════════════════════
     PART 1 · Shell CSS · iOS 26 Liquid Glass Floating Capsule Nav
     ═══════════════════════════════════════════════════════════════ */

  /* ── 1.1 基础重置 ── */
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0; padding: 0;
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── 1.2 应用容器 ── */
  .shell-container {
    position: relative;
    display: flex;
    flex-direction: column;
    max-width: 420px;
    min-height: 100vh;
    margin: 0 auto;
    background: var(--bg);
    box-shadow: 0 0 40px rgba(15, 23, 42, 0.10);
    overflow: hidden;
  }

  /* ── 1.2b 装饰性背景光斑 · iOS 26 深度感 ──
     两个模糊渐变光斑固定在容器顶部，透过玻璃卡片产生色彩折射。 */
  .shell-container::before {
    content: '';
    position: absolute;
    top: -60px;
    right: -40px;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  .shell-container::after {
    content: '';
    position: absolute;
    top: 120px;
    left: -60px;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* 内容区在光斑之上 */
  .shell-content { position: relative; z-index: 1; }
  .bottom-nav { z-index: 50; }

  /* ── 1.3 内容区 · 底部预留悬浮导航空间 ── */
  .shell-content {
    flex: 1;
    padding-bottom: 96px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
  }

  /* ═══════════════════════════════════════════════════════════════
     1.4 底部悬浮胶囊导航 · iOS 26 Liquid Glass Floating Capsule
     ─────────────────────────────────────────────────────────────────
     核心特征：
     · 悬浮于内容之上，不贴底边（bottom: 20px）
     · 左右留边距（width: calc(100% - 32px)）
     · 胶囊外形（border-radius: 9999px）
     · 液态玻璃材质（半透明 + 模糊 + 饱和度增强 + 内高光）
     · 选中项有玻璃透镜高亮（glass lens blob）
     ═══════════════════════════════════════════════════════════════ */
  .bottom-nav {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 388px;
    height: 64px;
    background: var(--glass-nav);
    backdrop-filter: blur(var(--glass-nav-blur)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--glass-nav-blur)) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 9999px;
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    padding: 6px;
    gap: 2px;
    z-index: 50;
    box-shadow:
      0 8px 32px rgba(15, 23, 42, 0.12),
      0 2px 8px rgba(15, 23, 42, 0.06),
      var(--glass-inner-highlight);
  }

  /* ── 1.5 单个标签 ──
     胶囊内等分；选中项有玻璃透镜背景。 */
  .nav-item {
    flex: 1;
    height: 52px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    background: transparent;
    border: none;
    border-radius: 9999px;
    color: var(--text-muted);
    font-family: var(--font-sans);
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
    position: relative;
    transition: color var(--ease-out), background var(--ease-spring), box-shadow var(--ease-spring);
  }

  .nav-item:active {
    transform: scale(0.92);
  }

  .nav-item svg {
    width: 22px;
    height: 22px;
    stroke-width: 2;
    transition: transform var(--ease-spring);
  }

  /* ── 1.6 选中态 · Glass Lens 透镜高亮 ──
     iOS 26 标志性效果：选中项背后出现玻璃透镜圆角矩形 */
  .nav-item.active,
  .nav-item[data-active="true"] {
    color: var(--primary);
    background: rgba(16, 185, 129, 0.12);
    box-shadow:
      inset 0 0 0 1px rgba(16, 185, 129, 0.15),
      var(--glass-inner-highlight);
  }

  .nav-item.active svg,
  .nav-item[data-active="true"] svg {
    transform: scale(1.1);
  }

  /* ── 1.7 强调标签 · 导入 ──
     不再凸出导航栏；改为胶囊内的实心圆形图标按钮。 */
  .nav-item--emphasis {
    flex: 0 0 auto;
    width: 52px;
  }

  .nav-emphasis-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--primary);
    color: #FFFFFF;
    box-shadow:
      0 4px 12px rgba(16, 185, 129, 0.30),
      var(--glass-inner-highlight);
    transition: box-shadow var(--ease-out), transform var(--ease-spring);
  }

  .nav-item--emphasis:active .nav-emphasis-badge {
    transform: scale(0.90);
  }

  .nav-emphasis-badge svg {
    width: 20px;
    height: 20px;
    stroke-width: 2.5;
  }

  /* 强调标签选中态 · 玻璃透镜环 */
  .nav-item--emphasis.active,
  .nav-item--emphasis[data-active="true"] {
    background: rgba(16, 185, 129, 0.12);
    box-shadow:
      inset 0 0 0 1px rgba(16, 185, 129, 0.15),
      var(--glass-inner-highlight);
  }

  .nav-item--emphasis.active .nav-emphasis-badge,
  .nav-item--emphasis[data-active="true"] .nav-emphasis-badge {
    box-shadow:
      0 4px 12px rgba(16, 185, 129, 0.30),
      0 0 0 3px var(--primary-soft),
      var(--glass-inner-highlight);
  }

  /* ── 1.8 标签文字 ── */
  .nav-label {
    font-family: var(--font-sans);
    font-size: 10px;
    font-weight: 600;
    line-height: 1;
  }

  /* ═══════════════════════════════════════════════════════════════
     Dark Mode 深色模式
     ═══════════════════════════════════════════════════════════════ */
  .dark .bottom-nav {
    background: var(--glass-nav);
    backdrop-filter: blur(var(--glass-nav-blur)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--glass-nav-blur)) saturate(180%);
    border-color: var(--glass-border);
  }

  .dark .nav-item.active,
  .dark .nav-item[data-active="true"] {
    background: rgba(16, 185, 129, 0.18);
    box-shadow: inset 0 0 0 1px rgba(16, 185, 129, 0.20), var(--glass-inner-highlight);
  }

  .dark .nav-emphasis-badge {
    box-shadow: 0 4px 14px rgba(16, 185, 129, 0.50), var(--glass-inner-highlight);
  }

  .dark .nav-item--emphasis.active .nav-emphasis-badge,
  .dark .nav-item--emphasis[data-active="true"] .nav-emphasis-badge {
    box-shadow: 0 4px 14px rgba(16, 185, 129, 0.50), 0 0 0 3px var(--primary-soft), var(--glass-inner-highlight);
  }
</style>

<!-- ═══════════════════════════════════════════════════════════════
     Page-Specific CSS · 考试完成 (Exam Complete) · iOS 26 Liquid Glass
     沉浸式页面（无底部导航），内容底部留白 40px。
     ═══════════════════════════════════════════════════════════════ -->
<style>
  /* 沉浸式页面：无底部导航，内容底部留白收紧至 40px */
  .shell-content {
    padding-bottom: 40px !important;
  }
</style>

<!-- ═══════════════════════════════════════════════════════════════
     Shell Structure · 应用框架（沉浸式，无底部导航）
     ═══════════════════════════════════════════════════════════════ -->
<div class="shell-container">
  <main class="shell-content">

    <!-- ══ 1 · HEADER AREA（居中，padding-top 60px）══ -->
    <section style="padding-top: 60px;">
      <div class="flex flex-col items-center" style="gap: 12px;">
        <!-- 成功图标：80x80 圆形，绿色背景，白色 trophy 图标 40px -->
        <div style="width: 80px; height: 80px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-primary);">
          <i data-lucide="trophy" style="color: #FFFFFF; width: 40px; height: 40px;"></i>
        </div>
        <!-- 标题：考试完成 -->
        <h1 style="font-size: 24px; font-weight: 800; color: var(--text-primary); margin: 0; font-family: var(--font-display); line-height: 1.2;">考试完成</h1>
        <!-- 副标题：计算机基础 · 期末考试 -->
        <p style="font-size: 14px; color: var(--text-muted); margin: 0; line-height: 1.4;">计算机基础 · 期末考试</p>
      </div>
    </section>

    <!-- ══ 2 · SCORE RING + SUMMARY（玻璃卡片）══ -->
    <section style="margin: 24px 16px;">
      <div style="background: var(--glass-card); backdrop-filter: blur(var(--glass-card-blur)) saturate(180%); -webkit-backdrop-filter: blur(var(--glass-card-blur)) saturate(180%); border: 1px solid var(--glass-border); border-radius: var(--radius-xl); padding: 28px 24px;">
        <div class="flex flex-col items-center" style="gap: 16px;">
          <!-- 圆环进度：120x120 SVG，80% 填充 -->
          <div style="position: relative; width: 120px; height: 120px;">
            <svg width="120" height="120" viewBox="0 0 120 120" style="display: block;">
              <g transform="rotate(-90 60 60)">
                <circle cx="60" cy="60" r="52" fill="none" stroke="var(--border)" stroke-width="8"/>
                <circle cx="60" cy="60" r="52" fill="none" stroke="var(--primary)" stroke-width="8" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="65.3"/>
              </g>
            </svg>
            <!-- 圆环中心：分数 80 / 分 -->
            <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
              <span style="font-size: 36px; font-weight: 800; color: var(--primary); line-height: 1;">80</span>
              <span style="font-size: 14px; color: var(--text-muted); line-height: 1; margin-top: 2px;">分</span>
            </div>
          </div>
          <!-- 通过 徽章 -->
          <span style="display: inline-block; background: var(--primary-soft); color: var(--primary-strong); font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: var(--radius-full);">通过</span>
          <!-- 满分 100 分 -->
          <span style="font-size: 13px; color: var(--text-muted); line-height: 1.4;">满分 100 分</span>
          <p style="font-size: 13px; color: var(--text-muted); margin: 10px 0 0; line-height: 1.5;">恭喜通过考试！继续保持学习节奏 💪</p>
        </div>
      </div>
    </section>

    <!-- ══ 3 · STATS ROW（三列统计，玻璃卡片）══ -->
    <section style="margin: 12px 16px;">
      <div style="background: var(--glass-card); backdrop-filter: blur(var(--glass-card-blur)) saturate(180%); -webkit-backdrop-filter: blur(var(--glass-card-blur)) saturate(180%); border: 1px solid var(--glass-border); border-radius: var(--radius-xl); padding: 20px;">
        <div class="flex">
          <!-- 答对 -->
          <div class="flex-1 flex flex-col items-center" style="gap: 4px;">
            <span style="font-size: 22px; font-weight: 800; color: var(--primary); line-height: 1.2;">17/20</span>
            <span style="font-size: 12px; color: var(--text-muted); line-height: 1.4;">答对</span>
          </div>
          <!-- 答错 -->
          <div class="flex-1 flex flex-col items-center" style="gap: 4px; border-left: 1px solid var(--border);">
            <span style="font-size: 22px; font-weight: 800; color: var(--state-error); line-height: 1.2;">3/20</span>
            <span style="font-size: 12px; color: var(--text-muted); line-height: 1.4;">答错</span>
          </div>
          <!-- 用时 -->
          <div class="flex-1 flex flex-col items-center" style="gap: 4px; border-left: 1px solid var(--border);">
            <span style="font-size: 22px; font-weight: 800; color: var(--text-primary); line-height: 1.2; font-variant-numeric: tabular-nums;">45:00</span>
            <span style="font-size: 12px; color: var(--text-muted); line-height: 1.4;">用时</span>
          </div>
        </div>
      </div>
    </section>

    <!-- ══ 4 · DETAILED BREAKDOWN（白色卡片）══ -->
    <section style="margin: 12px 16px;">
      <div style="background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 16px;">
        <h3 style="display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; color: var(--text-primary); margin: 0 0 4px; line-height: 1.3;"><i data-lucide="clipboard-list" style="width: 16px; height: 16px;"></i>答题详情</h3>
        <!-- Row 1: 单选题 -->
        <div class="flex items-center justify-between" style="padding: 12px 0; border-bottom: 1px solid var(--border-soft); gap: 12px;">
          <div class="flex items-center" style="gap: 10px;">
            <i data-lucide="check-circle" class="w-5 h-5" style="color: var(--primary);"></i>
            <span style="font-size: 14px; color: var(--text-primary); font-weight: 500; line-height: 1.4;">单选题</span>
          </div>
          <span style="font-size: 14px; color: var(--primary); font-weight: 600; line-height: 1.4;">15/18 正确</span>
        </div>
        <!-- Row 2: 多选题 -->
        <div class="flex items-center justify-between" style="padding: 12px 0; border-bottom: 1px solid var(--border-soft); gap: 12px;">
          <div class="flex items-center" style="gap: 10px;">
            <i data-lucide="check-circle" class="w-5 h-5" style="color: var(--primary);"></i>
            <span style="font-size: 14px; color: var(--text-primary); font-weight: 500; line-height: 1.4;">多选题</span>
          </div>
          <span style="font-size: 14px; color: var(--primary); font-weight: 600; line-height: 1.4;">2/2 正确</span>
        </div>
        <!-- Row 3: 完成时间（最后一行，无下边框） -->
        <div class="flex items-center justify-between" style="padding: 12px 0; gap: 12px;">
          <div class="flex items-center" style="gap: 10px;">
            <i data-lucide="clock" class="w-5 h-5" style="color: var(--text-muted);"></i>
            <span style="font-size: 14px; color: var(--text-primary); font-weight: 500; line-height: 1.4;">完成时间</span>
          </div>
          <span style="font-size: 14px; color: var(--text-secondary); font-weight: 600; line-height: 1.4;">45分0秒</span>
        </div>
      </div>
    </section>

    <!-- ══ 5 · ACTION BUTTONS（纵向排列）══ -->
    <section style="margin: 24px 16px;">
      <div class="flex flex-col" style="gap: 12px;">
        <!-- 主按钮：查看答题报告 -->
        <button type="button" data-dom-id="cta-view-report" style="width: 100%; height: 48px; background: var(--primary); color: #FFFFFF; border: none; border-radius: var(--radius-full); font-size: 15px; font-weight: 700; font-family: var(--font-sans); cursor: pointer; box-shadow: var(--shadow-primary); transition: transform var(--ease-spring);">查看答题报告</button>
        <!-- 次按钮：返回首页 -->
        <button type="button" data-dom-id="cta-back-home" style="width: 100%; height: 48px; background: var(--surface); color: var(--text-secondary); border: 1px solid var(--border); border-radius: var(--radius-full); font-size: 15px; font-weight: 600; font-family: var(--font-sans); cursor: pointer; transition: transform var(--ease-spring);">返回首页</button>
      </div>
    </section>

  </main>
</div>

<script>lucide.createIcons();</script>
</body>
</html>
