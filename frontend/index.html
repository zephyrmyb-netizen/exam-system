<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F6F8FC" />
    <meta name="description" content="学习宝 - AI 导入题库、刷题复习和学习数据分析工具" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>学习宝</title>
    <script>
      (() => {
        const isVitePreview = location.port === "5173" || location.port === "5174";
        const reloadKey = "xuexibao-dev-sw-cleanup";
        if (!isVitePreview || !("serviceWorker" in navigator)) return;
        if (!navigator.serviceWorker.controller) {
          sessionStorage.removeItem(reloadKey);
          return;
        }
        if (sessionStorage.getItem(reloadKey)) return;
        sessionStorage.setItem(reloadKey, "1");

        Promise.all([
          navigator.serviceWorker.getRegistrations().then((registrations) =>
            Promise.all(registrations.map((registration) => registration.unregister())),
          ),
          "caches" in window
            ? caches.keys().then((keys) =>
                Promise.all(keys.filter((key) => key.startsWith("xuexibao-shell-")).map((key) => caches.delete(key))),
              )
            : Promise.resolve(),
        ]).finally(() => location.reload());
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
